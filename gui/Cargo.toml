[package]
name = "ul2596_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
# Turn off defaults to drop `wgpu`, and use `glow` (OpenGL) instead.
# `default_fonts` ensures standard text rendering still works.
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "persistence"] }

egui_plot = "0.35"          
serialport = "4.3"          
csv = "1.3"                 
rfd = "0.17"                

# Swapped "all_loaders" for "image" to only pull in PNG/JPEG support
egui_extras = { version = "0.34", features = ["image"] }

crossbeam-channel = "0.5"
serde = { version = "1.0.228", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
