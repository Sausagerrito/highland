[package]
name = "ul2596_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.34"             
egui_plot = "0.35"          
serialport = "4.3"          
csv = "1.3"                 
rfd = "0.17"                
egui_extras = { version = "0.34", features = ["all_loaders"] }
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

